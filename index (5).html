<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Caixa do Grupo Atos</title>
<style>
  :root{
    --tinta:#24211c; --tinta-suave:#7a7264;
    --papel:#efe7d6; --cartao:#fbf6ec;
    --linha:#e0d6c1; --linha-forte:#d3c7ad;
    --entrada:#2f5d43; --saida:#9c3b26; --ouro:#cba64f;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--papel);color:var(--tinta);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  .atos-root{max-width:720px;margin:0 auto;min-height:100vh;padding:0 0 56px;}
  .atos-word{font-family:Georgia,"Times New Roman",serif;font-weight:700;
    letter-spacing:.24em;line-height:1;padding-right:.24em;display:inline-block;}

  .topo{background:linear-gradient(180deg,#2b2721,#211d18);display:flex;
    align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:20px 26px;}
  .topo-marca{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
  .logo-wrap{position:relative;display:inline-block;}
  .logo-seta{position:absolute;left:-16%;top:52%;width:132%;transform:translateY(-50%);pointer-events:none;}
  .topo-sub{color:#b8ad95;font-size:11px;letter-spacing:.26em;text-transform:uppercase;}
  .topo-admin{display:flex;align-items:center;gap:14px;}
  .topo-quem{color:#f4ecd9;font-size:13px;font-weight:600;}
  .btn-contorno{background:transparent;color:#f4ecd9;border:1px solid #5c5344;
    border-radius:999px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn-contorno:hover{border-color:var(--ouro);color:#fff;}
  .btn-linha-clara{background:none;border:none;color:#c3b89f;font-size:13px;
    cursor:pointer;font-family:inherit;text-decoration:underline;}
  .btn-linha-clara:hover{color:#f4ecd9;}

  .saldo-hero{margin:26px 22px 0;background:var(--cartao);border:1px solid var(--linha);
    border-radius:16px;padding:30px 30px 22px;text-align:center;
    box-shadow:0 1px 0 rgba(36,33,28,.05),0 14px 30px -24px rgba(36,33,28,.4);}
  .saldo-rot{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--tinta-suave);margin-bottom:8px;}
  .saldo-num{font-family:Georgia,serif;font-weight:700;font-size:clamp(42px,11vw,62px);
    line-height:1;letter-spacing:-.015em;font-variant-numeric:tabular-nums;}
  .saldo-num.neg{color:var(--saida);}
  .saldo-seta{display:flex;justify-content:center;margin:14px 0 2px;opacity:.9;}
  .resumo{display:flex;align-items:stretch;justify-content:center;gap:4px;margin-top:14px;
    padding-top:18px;border-top:1px solid var(--linha);}
  .resumo-col{flex:1;display:flex;flex-direction:column;gap:5px;align-items:center;min-width:0;}
  .resumo-rot{font-size:12px;color:var(--tinta-suave);font-weight:600;}
  .resumo-rot.entrada{color:var(--entrada);} .resumo-rot.saida{color:var(--saida);}
  .resumo-val{font-family:Georgia,serif;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;}
  .resumo-div{width:1px;background:var(--linha);}

  .aviso{margin:18px 22px 0;background:#f6e6de;border:1px solid #e2c1b4;color:#8a3320;
    padding:12px 16px;border-radius:12px;font-size:13px;}

  .painel{margin:22px 22px 0;background:var(--cartao);border:1px solid var(--linha);
    border-radius:16px;padding:24px 26px 26px;}
  .secao-titulo{font-family:Georgia,serif;font-size:20px;font-weight:700;margin:0 0 18px;}
  .seg{display:inline-flex;border:1px solid var(--linha-forte);border-radius:10px;
    padding:4px;background:#f1e9d9;margin-bottom:22px;}
  .seg-btn{border:none;background:none;padding:9px 26px;border-radius:7px;font-size:14px;
    font-weight:700;color:var(--tinta-suave);cursor:pointer;font-family:inherit;}
  .seg-btn.ativo.entrada{background:var(--entrada);color:#fff;}
  .seg-btn.ativo.saida{background:var(--saida);color:#fff;}
  .campos{display:grid;grid-template-columns:1fr 1fr;gap:20px 22px;}
  .campo{display:flex;flex-direction:column;gap:8px;}
  .campo-largo{grid-column:1/-1;}
  .campo>span{font-size:13px;color:var(--tinta-suave);font-weight:600;}
  .campo input{border:none;border-bottom:1.5px solid var(--linha-forte);background:transparent;
    padding:8px 2px;font-size:16px;font-family:inherit;color:var(--tinta);width:100%;}
  .campo input::placeholder{color:#b3a892;}
  .campo input:focus{outline:none;border-bottom-color:var(--tinta);}
  .valor-wrap{display:flex;align-items:baseline;gap:6px;border-bottom:1.5px solid var(--linha-forte);}
  .valor-wrap:focus-within{border-bottom-color:var(--tinta);}
  .valor-wrap em{font-style:normal;font-family:Georgia,serif;font-weight:700;color:var(--tinta-suave);font-size:16px;}
  .valor-wrap input{border:none;padding:8px 0;font-family:Georgia,serif;font-weight:700;font-size:20px;}
  .form-erro{color:var(--saida);font-size:13px;margin-top:16px;}
  .btn-registrar{margin-top:22px;width:100%;border:none;border-radius:11px;padding:14px;
    font-size:15px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;letter-spacing:.01em;}
  .btn-registrar.entrada{background:var(--entrada);} .btn-registrar.saida{background:var(--saida);}
  .btn-registrar:hover{filter:brightness(1.06);}
  .btn-registrar:disabled{opacity:.6;cursor:default;filter:none;}

  .livro{margin:30px 22px 0;}
  .livro-topo{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .filtros{display:flex;gap:8px;flex-wrap:wrap;}
  .chip{border:1px solid var(--linha-forte);background:var(--cartao);border-radius:999px;
    padding:7px 15px;font-size:13px;color:var(--tinta-suave);cursor:pointer;font-family:inherit;}
  .chip:hover{border-color:var(--tinta-suave);}
  .chip-ativo{background:var(--tinta);color:#f4ecd9;border-color:var(--tinta);}
  .chip-icone{font-size:15px;line-height:1;padding:7px 12px;}
  .linhas{list-style:none;margin:0;padding:0;background:var(--cartao);border:1px solid var(--linha);
    border-radius:14px;overflow:hidden;}
  .linha{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;
    padding:16px 20px 16px 22px;border-bottom:1px solid var(--linha);border-left:3px solid transparent;}
  .linha:last-child{border-bottom:none;}
  .linha.entrada{border-left-color:var(--entrada);} .linha.saida{border-left-color:var(--saida);}
  .linha-esq{min-width:0;flex:1;}
  .linha-desc{font-weight:600;font-size:15.5px;}
  .linha-motivo{color:var(--tinta-suave);font-size:14px;margin-top:3px;}
  .linha-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:#9c9481;}
  .sep{color:#c7bca4;}
  .linha-valor{font-family:Georgia,serif;font-weight:700;font-size:17px;white-space:nowrap;
    font-variant-numeric:tabular-nums;padding-top:1px;}
  .linha-valor.entrada{color:var(--entrada);} .linha-valor.saida{color:var(--saida);}
  .link-excluir{background:none;border:none;color:var(--saida);font-size:12px;cursor:pointer;
    text-decoration:underline;font-family:inherit;padding:0;}
  .confirmar{display:inline-flex;align-items:center;gap:8px;color:var(--tinta);}
  .link-perigo{background:none;border:none;color:var(--saida);font-weight:700;cursor:pointer;font-family:inherit;text-decoration:underline;}
  .link-neutro{background:none;border:none;color:var(--tinta-suave);cursor:pointer;font-family:inherit;text-decoration:underline;}
  .vazio{background:var(--cartao);border:1px dashed var(--linha-forte);border-radius:14px;
    padding:34px;text-align:center;color:var(--tinta-suave);font-size:14px;}
  .rodape{margin:30px 22px 0;text-align:center;font-size:12px;color:#a79f8c;line-height:1.6;}

  .modal-fundo{position:fixed;inset:0;background:rgba(24,21,17,.5);display:flex;
    align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal{background:var(--cartao);border-radius:18px;padding:30px 28px;width:100%;max-width:370px;
    display:flex;flex-direction:column;gap:15px;box-shadow:0 24px 60px rgba(0,0,0,.3);border:1px solid var(--linha);}
  .modal-titulo{font-family:Georgia,serif;font-size:21px;margin:0;font-weight:700;}
  .modal-acoes{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .btn-linha{background:none;border:none;color:var(--tinta-suave);font-size:14px;cursor:pointer;font-family:inherit;text-decoration:underline;}
  .btn-cheio{background:var(--tinta);color:#f4ecd9;border:none;border-radius:10px;padding:11px 22px;
    font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-cheio:hover{background:#171512;}

  @media(max-width:520px){
    .campos{grid-template-columns:1fr;}
    .topo{padding:18px 20px;}
    .saldo-hero,.painel,.livro,.aviso,.rodape{margin-left:16px;margin-right:16px;}
    .resumo-rot{font-size:11px;} .resumo-val{font-size:15px;}
  }
</style>
</head>
<body>
<div class="atos-root" id="app"></div>

<script type="module">
/* ================================================================
   CAIXA DO GRUPO ATOS
   ================================================================ */

/* ---- 1) ADMINISTRADORES (quem pode registrar/excluir) ---------- */
const ADMINS = [
  { login: "Manassés Oliveira", senha: "Manassesatos12" },
  { login: "Amanda Almeida",   senha: "Amandaatos12" },
];

/* ---- 2) FIREBASE ------------------------------------------------
   Deixe em branco para testar (salva só neste aparelho).
   Cole aqui as chaves do seu projeto para SINCRONIZAR entre todos.
   O passo a passo está no README.md.                               */
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: "",
};
const USANDO_FIREBASE = !!(firebaseConfig.projectId && firebaseConfig.apiKey);

/* ================================================================ */

const LS_KEY = "atos_movimentacoes";
const app = document.getElementById("app");

let movs = [];
const form = { tipo: "entrada", valor: "", descricao: "", motivo: "" };
const login = { nome: "", senha: "" };
const ui = { tela: "viewer", admin: null, filtro: "todos", confirmarId: null,
             erroForm: "", erroLogin: "", modo: "local", ok: true };
let store = null;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const brl = (n) => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(n)||0);
const fmtData = (iso) => { try { return new Date(iso).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"}); } catch { return ""; } };
const fmtHora = (iso) => { try { return new Date(iso).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}); } catch { return ""; } };
const parseValor = (str) => { const l=String(str).trim().replace(/\s/g,"").replace(/\./g,"").replace(",","."); return parseFloat(l); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function seta(color, stroke){
  return `<svg viewBox="0 0 420 60" width="100%" fill="none" stroke="${color}" stroke-linecap="round" aria-hidden="true">
    <path d="M406 30 Q 210 24 40 30" stroke-width="${stroke}"/>
    <path d="M40 30 L 78 13" stroke-width="${stroke}"/>
    <path d="M40 30 L 78 47" stroke-width="${stroke}"/>
    <path d="M384 30 L 362 17" stroke-width="${stroke*0.8}"/>
    <path d="M394 30 L 372 17" stroke-width="${stroke*0.8}"/>
    <path d="M403 30 L 381 17" stroke-width="${stroke*0.8}"/></svg>`;
}
function logo(h, word, arrow){
  return `<div class="logo-wrap">
    <span class="atos-word" style="font-size:${h*0.66}px;color:${word}">ATOS</span>
    <div class="logo-seta">${seta(arrow,3.2)}</div></div>`;
}

/* -------------------- ARMAZENAMENTO ---------------------------- */
async function initStore(){
  if (USANDO_FIREBASE){
    try{
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } =
        await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      const fa = initializeApp(firebaseConfig);
      const db = getFirestore(fa);
      ui.modo = "nuvem";
      const q = query(collection(db,"atos_caixa"), orderBy("data","desc"));
      onSnapshot(q,
        (snap)=>{ movs = snap.docs.map(d=>({ id:d.id, ...d.data() })); ui.ok=true; render(); },
        ()=>{ ui.ok=false; render(); });
      store = {
        add: (m)=> addDoc(collection(db,"atos_caixa"), m),
        remove: (id)=> deleteDoc(doc(db,"atos_caixa", id)),
      };
      return;
    }catch(e){ console.warn("Firebase indisponível, usando modo local.", e); }
  }
  ui.modo = "local";
  try { movs = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch { movs = []; }
  const persist = ()=>{ try{ localStorage.setItem(LS_KEY, JSON.stringify(movs)); ui.ok=true; }catch{ ui.ok=false; } };
  store = {
    add: async (m)=>{ movs.unshift({ id:uid(), ...m }); persist(); render(); },
    remove: async (id)=>{ movs = movs.filter(x=>x.id!==id); persist(); render(); },
  };
  render();
}

/* -------------------- AÇÕES ------------------------------------ */
function entrar(){
  const achou = ADMINS.find(a =>
    a.login.toLowerCase() === login.nome.trim().toLowerCase() && a.senha === login.senha);
  if (achou){ ui.admin=achou.login; ui.tela="admin"; login.nome=""; login.senha=""; ui.erroLogin=""; }
  else { ui.erroLogin="Login ou senha incorretos. Confira e tente de novo."; }
  render();
}
function sair(){ ui.admin=null; ui.tela="viewer"; ui.erroForm=""; render(); }

async function registrar(){
  ui.erroForm="";
  const v = parseValor(form.valor);
  if (!v || isNaN(v) || v<=0){ ui.erroForm="Informe um valor válido. Use vírgula para os centavos, ex: 150,00"; return render(); }
  if (!form.descricao.trim()){ ui.erroForm = form.tipo==="entrada" ? "Descreva o que entrou." : "Descreva o que saiu."; return render(); }
  if (!form.motivo.trim()){ ui.erroForm="Informe o motivo da movimentação."; return render(); }
  const m = { tipo:form.tipo, valor:v, descricao:form.descricao.trim(),
              motivo:form.motivo.trim(), autor:ui.admin, data:new Date().toISOString() };
  try{
    await store.add(m);
    form.valor=""; form.descricao=""; form.motivo=""; form.tipo="entrada"; ui.erroForm="";
    render();
  }catch(e){ ui.ok=false; ui.erroForm="Não foi possível salvar agora. Tente novamente."; render(); }
}
async function remover(id){ ui.confirmarId=null; try{ await store.remove(id); }catch{ ui.ok=false; } render(); }

/* -------------------- RENDER ----------------------------------- */
function render(){
  const totalEntradas = movs.filter(m=>m.tipo==="entrada").reduce((s,m)=>s+Number(m.valor||0),0);
  const totalSaidas   = movs.filter(m=>m.tipo==="saida").reduce((s,m)=>s+Number(m.valor||0),0);
  const saldo = totalEntradas - totalSaidas;
  const lista = movs.filter(m => ui.filtro==="todos" ? true : m.tipo===ui.filtro);

  const cabecalho = `
    <header class="topo">
      <div class="topo-marca">${logo(50,"#f4ecd9","#cba64f")}<span class="topo-sub">Caixa do Grupo</span></div>
      ${ ui.tela==="admin"
        ? `<div class="topo-admin"><span class="topo-quem">${esc(ui.admin)}</span>
             <button class="btn-linha-clara" data-action="sair">Sair</button></div>`
        : `<button class="btn-contorno" data-action="abrir-login">Entrar como administrador</button>` }
    </header>`;

  const hero = `
    <section class="saldo-hero">
      <div class="saldo-rot">Saldo em caixa</div>
      <div class="saldo-num ${saldo<0?"neg":""}">${brl(saldo)}</div>
      <div class="saldo-seta" style="width:200px;margin-left:auto;margin-right:auto;">${seta("#d8cdb2",2.2)}</div>
      <div class="resumo">
        <div class="resumo-col"><span class="resumo-rot entrada">Entradas</span><span class="resumo-val">${brl(totalEntradas)}</span></div>
        <div class="resumo-div"></div>
        <div class="resumo-col"><span class="resumo-rot saida">Saídas</span><span class="resumo-val">${brl(totalSaidas)}</span></div>
        <div class="resumo-div"></div>
        <div class="resumo-col"><span class="resumo-rot">Lançamentos</span><span class="resumo-val">${movs.length}</span></div>
      </div>
    </section>`;

  const banner = !ui.ok ? `<div class="aviso">Houve um problema ao salvar os dados. As alterações podem não ficar guardadas. Tente de novo ou recarregue a página.</div>` : "";

  const painel = ui.tela==="admin" ? `
    <section class="painel">
      <h2 class="secao-titulo">Nova movimentação</h2>
      <div class="seg">
        <button class="seg-btn ${form.tipo==="entrada"?"ativo entrada":""}" data-action="set-tipo" data-tipo="entrada">Entrada</button>
        <button class="seg-btn ${form.tipo==="saida"?"ativo saida":""}" data-action="set-tipo" data-tipo="saida">Saída</button>
      </div>
      <div class="campos">
        <label class="campo">
          <span>Valor</span>
          <div class="valor-wrap"><em>R$</em>
            <input inputmode="decimal" placeholder="0,00" data-field="valor" value="${esc(form.valor)}"></div>
        </label>
        <label class="campo">
          <span>${form.tipo==="entrada"?"O que entrou":"O que saiu"}</span>
          <input placeholder="${form.tipo==="entrada"?"Ex: Oferta do culto":"Ex: Compra de material"}" data-field="descricao" value="${esc(form.descricao)}">
        </label>
        <label class="campo campo-largo">
          <span>${form.tipo==="entrada"?"Por que entrou":"Por que saiu"}</span>
          <input placeholder="${form.tipo==="entrada"?"Ex: Arrecadação do domingo":"Ex: Preparo do evento de jovens"}" data-field="motivo" value="${esc(form.motivo)}">
        </label>
      </div>
      ${ui.erroForm?`<div class="form-erro">${esc(ui.erroForm)}</div>`:""}
      <button class="btn-registrar ${form.tipo}" data-action="registrar">Registrar movimentação</button>
    </section>` : "";

  const itens = lista.map(m => `
    <li class="linha ${m.tipo}">
      <div class="linha-esq">
        <div class="linha-desc">${esc(m.descricao)}</div>
        <div class="linha-motivo">${esc(m.motivo)}</div>
        <div class="linha-meta">
          <span>${fmtData(m.data)}</span><span class="sep">·</span>
          <span>${fmtHora(m.data)}</span><span class="sep">·</span>
          <span>${esc(m.autor)}</span>
          ${ ui.tela==="admin"
            ? ( ui.confirmarId===m.id
                ? `<span class="confirmar">Excluir?
                     <button class="link-perigo" data-action="confirmar-excluir" data-id="${esc(m.id)}">sim</button>
                     <button class="link-neutro" data-action="cancelar-excluir">não</button></span>`
                : `<button class="link-excluir" data-action="pedir-excluir" data-id="${esc(m.id)}">excluir</button>` )
            : "" }
        </div>
      </div>
      <div class="linha-valor ${m.tipo}">${m.tipo==="entrada"?"+":"−"} ${brl(m.valor)}</div>
    </li>`).join("");

  const livro = `
    <section class="livro">
      <div class="livro-topo">
        <h2 class="secao-titulo">Movimentações</h2>
        <div class="filtros">
          ${[["todos","Todas"],["entrada","Entradas"],["saida","Saídas"]].map(([v,t])=>
            `<button class="chip ${ui.filtro===v?"chip-ativo":""}" data-action="set-filtro" data-filtro="${v}">${t}</button>`).join("")}
          <button class="chip chip-icone" data-action="atualizar" title="Atualizar">↻</button>
        </div>
      </div>
      ${ lista.length===0
        ? `<div class="vazio">${movs.length===0?"Nenhuma movimentação registrada ainda.":"Nenhuma movimentação neste filtro."}</div>`
        : `<ul class="linhas">${itens}</ul>` }
    </section>`;

  const rodape = ui.modo==="nuvem"
    ? `<footer class="rodape">Aberto a todos do grupo. Somente os administradores registram ou excluem.</footer>`
    : `<footer class="rodape">Modo local: as movimentações ficam salvas só neste aparelho.<br>Para todos do grupo verem o mesmo caixa, configure o Firebase (veja o README).</footer>`;

  const modal = ui.tela==="login" ? `
    <div class="modal-fundo" data-action="fechar-login">
      <div class="modal" data-stop="1">
        <div>${logo(44,"#24211c","#24211c")}</div>
        <h3 class="modal-titulo">Entrar como administrador</h3>
        <label class="campo"><span>Login</span>
          <input data-field="loginNome" placeholder="Seu nome de login" value="${esc(login.nome)}"></label>
        <label class="campo"><span>Senha</span>
          <input data-field="loginSenha" type="password" placeholder="Sua senha" value="${esc(login.senha)}"></label>
        ${ui.erroLogin?`<div class="form-erro">${esc(ui.erroLogin)}</div>`:""}
        <div class="modal-acoes">
          <button class="btn-linha" data-action="fechar-login">Voltar</button>
          <button class="btn-cheio" data-action="entrar">Entrar</button>
        </div>
      </div>
    </div>` : "";

  app.innerHTML = cabecalho + hero + banner + painel + livro + rodape + modal;
}

/* -------------------- EVENTOS ---------------------------------- */
app.addEventListener("input", (e)=>{
  const f = e.target.dataset.field; if(!f) return;
  if (f==="loginNome") login.nome = e.target.value;
  else if (f==="loginSenha") login.senha = e.target.value;
  else form[f] = e.target.value;
});
app.addEventListener("click", (e)=>{
  const alvo = e.target.closest("[data-action]"); if(!alvo) return;
  const a = alvo.dataset.action;
  if (a==="abrir-login"){ ui.tela="login"; ui.erroLogin=""; render(); }
  else if (a==="fechar-login"){ if(e.target.dataset.action==="fechar-login"){ ui.tela = ui.admin?"admin":"viewer"; render(); } }
  else if (a==="entrar") entrar();
  else if (a==="sair") sair();
  else if (a==="set-tipo"){ form.tipo = alvo.dataset.tipo; ui.erroForm=""; render(); }
  else if (a==="registrar") registrar();
  else if (a==="set-filtro"){ ui.filtro = alvo.dataset.filtro; render(); }
  else if (a==="atualizar") render();
  else if (a==="pedir-excluir"){ ui.confirmarId = alvo.dataset.id; render(); }
  else if (a==="confirmar-excluir") remover(alvo.dataset.id);
  else if (a==="cancelar-excluir"){ ui.confirmarId=null; render(); }
});
app.addEventListener("keydown", (e)=>{
  if (e.key==="Enter" && ui.tela==="login"){ entrar(); }
});

render();
initStore();
</script>
</body>
</html>
